<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>CyberPi Flash</title>
<style>
body{font-family:system-ui;max-width:800px;margin:20px auto;padding:16px;background:#111;color:#eee}
h1{color:#4da6d9} .card{background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:12px;margin:8px 0}
.done{color:#3db872}.fail{color:#e74c3c}.info{color:#4da6d9}
button{background:#4da6d9;color:#111;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;margin:4px}
button:disabled{background:#555;color:#999}
#log{margin-top:12px;font-family:monospace;font-size:11px;max-height:400px;overflow-y:auto;background:#0a0a0a;padding:8px;border-radius:4px;border:1px solid #333}
</style></head><body>
<h1>CyberPi Flash</h1>
<div class="card"><button id="btn-pair">Pair Serial</button><button id="btn-check">Silent</button><span id="s1"></span></div>
<div class="card"><button id="btn-red">Red</button><button id="btn-blue">Blue</button><button id="btn-green">Green</button><span id="s2"></span></div>
<div id="log"></div>
<script>
var log=document.getElementById('log');
log.innerHTML='<div class="info">Loading esptool-js...</div>';

Promise.race([
 import("https://unpkg.com/esptool-js@0.6.0/bundle.js"),
 new Promise(function(_,r){setTimeout(function(){r(new Error('CDN timeout'));},10000);})
]).then(function(mod){
 log.innerHTML+='<div class="done">esptool-js loaded</div>';
 wire(mod.ESPLoader,mod.Transport);
}).catch(function(e){
 log.innerHTML+='<div class="fail">FAIL: '+(e.message||e)+'</div>';
});

function wire(ESPLoader,Transport){
 var port=null,ADDR=0x558000,TEXT_LEN=0xD1;
 var H='# led-test.py \u2014 Simple LED blink, no WiFi needed\r\n';
 var RED  =H+'from cyberpi import *\r\nimport time\r\n\r\nwhile True:\r\n    led.on(255, 0, 0, 1)  # red\r\n    time.sleep(0.5)\r\n    led.off(1)\r\n    time.sleep(0.5)\r\n';
 var BLUE =H+'from cyberpi import *\r\nimport time\r\n\r\nwhile True:\r\n    led.on(0, 0, 255, 1)  # blue\r\n    time.sleep(0.5)\r\n    led.off(1)\r\n    time.sleep(0.5)\r\n';
 var GREEN=H+'from cyberpi import *\r\nimport time\r\n\r\nwhile True:\r\n    led.on(0, 255, 0, 1)  # green\r\n    time.sleep(0.5)\r\n    led.off(1)\r\n    time.sleep(0.5)\r\n';

 function L(m,c){var t=new Date().toLocaleTimeString();log.innerHTML+='<div class="'+(c||'info')+'"><span class="t">'+t+'</span> — '+m+'</div>';log.scrollTop=log.scrollHeight;}

 document.getElementById('btn-pair').onclick=function(){
  navigator.serial.requestPort().then(function(p){port=p;document.getElementById('s1').innerHTML='<span class="done">Paired</span>';L('Paired','done');}).catch(function(e){if(e.name!=='NotFoundError')L('Error: '+e.message,'fail');});
 };
 document.getElementById('btn-check').onclick=function(){
  navigator.serial.getPorts().then(function(p){if(p.length){port=p[0];document.getElementById('s1').innerHTML='<span class="done">Found</span>';L('Silent OK','done');}});
 };

 async function flash(code,name){
  if(!port)return;
  var s2=document.getElementById('s2');s2.innerHTML='<span class="info">Flashing '+name+'...</span>';
  L('Flash: '+name,'info');
  var t,esploader;
  try{
   t=new Transport(port,true);
   esploader=new ESPLoader({transport:t,baudrate:115200,terminal:{clean:function(){},writeLine:function(){},write:function(){}},debugLogging:false});
   var chip=await esploader.main();
   L('Chip: '+chip,'done');
   var data=await esploader.readFlash(ADDR,4096);
   var sector=new Uint8Array(data);
   L('Read 4096B','done');
   var enc=new TextEncoder().encode(code);
   sector.set(enc,0);
   for(var i=enc.length;i<TEXT_LEN;i++)sector[i]=0x20;
   L('Patched: '+enc.length+'B','done');
   await esploader.writeFlash({fileArray:[{data:sector,address:ADDR}],flashMode:'dio',flashFreq:'40m',flashSize:'8MB',eraseAll:false,compress:true});
   L('FLASHED','done');
   s2.innerHTML='<span class="done">'+name+'!</span>';
   // Reset via RTS toggle (same as CLI esptool "Hard resetting via RTS pin")
   try{
    L('Resetting via RTS...','info');
    await port.setSignals({requestToSend:true});  // RTS low = reset
    await new Promise(function(r){setTimeout(r,100);});
    await port.setSignals({requestToSend:false}); // RTS high = run
    L('Reset done — check LEDs!','done');
   }catch(e2){L('Reset failed: '+(e2.message||e2)+' — press RESET button on CyberPi','warn');}
  }catch(e){L('FAIL: '+(e.message||e),'fail');s2.innerHTML='<span class="fail">Failed</span>';}
  finally{try{if(t)t.disconnect();}catch(_){}}
 }

 document.getElementById('btn-red').onclick=function(){flash(RED,'Red');};
 document.getElementById('btn-blue').onclick=function(){flash(BLUE,'Blue');};
 document.getElementById('btn-green').onclick=function(){flash(GREEN,'Green');};
 L('Ready — pair then click color','info');
}
</script>
</body></html>
