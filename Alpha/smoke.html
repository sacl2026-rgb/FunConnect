<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>WebHID CMSIS-DAP Smoke</title>
<style>
body{font-family:system-ui;max-width:800px;margin:20px auto;padding:16px;background:#111;color:#eee}
h1{color:#3db872;font-size:18px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:6px;padding:12px;margin:8px 0}
.done{color:#3db872}.fail{color:#e74c3c}.warn{color:#f39c12}.info{color:#4da6d9}
button{background:#3db872;color:#111;border:none;padding:8px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:600;margin:4px}
button:disabled{background:#555;color:#999}
#log{margin-top:12px;font-family:monospace;font-size:11px;max-height:400px;overflow-y:auto;background:#0a0a0a;padding:8px;border-radius:4px;border:1px solid #333}
.prog{display:inline-block;padding:5px 10px;margin:3px;background:#222;border:1px solid #444;border-radius:4px;cursor:pointer;font-size:13px}
.prog:hover,.prog.sel{border-color:#3db872;background:#1a3327}
</style></head><body>
<h1>WebHID CMSIS-DAP — V1.5 Smoke</h1>
<p style="color:#888;font-size:13px">Uses HID interface (3), not WebUSB (4). No claimInterface hang.</p>
<div class="card">
<button id="btn-pair">1. Pair HID</button>
<button id="btn-check">Silent Check</button>
<span id="s1"></span>
</div>
<div class="card">
<strong>2. Pick .hex</strong>
<div id="catalog">Loading...</div><span id="s2"></span>
</div>
<div class="card">
<button id="btn-go" disabled>3. Flash via WebHID</button><span id="s3"></span>
</div>
<div id="log"></div>
<script>
(function(){
var L=function(m,c){var d=document.getElementById('log');d.innerHTML+='<div class="'+(c||'info')+'"><span class="t">'+new Date().toLocaleTimeString()+'</span> — '+m+'</div>';d.scrollTop=d.scrollHeight;};
var tw=function(p,ms,l){return Promise.race([p,new Promise(function(_,r){setTimeout(function(){r(new Error(l+' timeout'));},ms);})]);};
var API='https://funconnect-v1.funconnect.workers.dev';
var device=null,hexBlob=null,progName='',hexBytes=null;

L('WebHID: '+(navigator.hid?'OK':'NEED CHROME/EDGE'),navigator.hid?'done':'fail');

function parseHex(t){
 var blocks=new Map(),high=0,lines=t.split(/[\r\n]+/);
 for(var i=0;i<lines.length;i++){
  var l=lines[i].trim();if(!l||l[0]!==':')continue;
  var b=[];for(var j=1;j<l.length;j+=2)b.push(parseInt(l.substring(j,j+2),16));
  if(b[0]+5!==b.length)continue;
  var s=0;for(var k=0;k<b.length;k++)s+=b[k];if((s&0xFF)!==0)continue;
  var a=(b[1]<<8)|b[2],ty=b[3],d=new Uint8Array(b.slice(4,4+b[0]));
  if(ty===0){var abs=high+a;if(blocks.has(abs)){var e=blocks.get(abs),m=new Uint8Array(e.length+d.length);m.set(e);m.set(d,e.length);blocks.set(abs,m);}else blocks.set(abs,d);}
  else if(ty===1)break;else if(ty===2)high=((d[0]<<8)|d[1])<<4;else if(ty===4)high=((d[0]<<8)|d[1])<<16;
 }
 return blocks;
}
function hexToBinary(t){
 var blocks=parseHex(t);if(blocks.size===0)return null;
 // V1 nRF51822 flash: 0x00000-0x40000 (256KB). Filter out V2 blocks at 0x10000000+.
 var min=Infinity,max=0;
 var v1blocks=new Map();
 blocks.forEach(function(d,a){
  if(a>=0x10000000)return; // Skip V2 region
  v1blocks.set(a,d);
  min=Math.min(min,a);max=Math.max(max,a+d.length);
 });
 if(v1blocks.size===0)return null;
 var bin=new Uint8Array(max-min);v1blocks.forEach(function(d,a){bin.set(d,a-min);});
 L('  V1 blocks:'+v1blocks.size+' range 0x'+min.toString(16)+'-0x'+max.toString(16),'info');
 return bin;
}

document.getElementById('btn-pair').onclick=function(){
 navigator.hid.requestDevice({filters:[{vendorId:0x0D28}]}).then(function(ds){
  device=ds[0]; // returns array
  document.getElementById('s1').innerHTML='<span class="done">'+device.productName+'</span>';
  L('Paired: '+device.productName+' VID=0x'+device.vendorId.toString(16)+' PID=0x'+device.productId.toString(16),'done');
  update();
 }).catch(function(e){if(e.name!=='NotFoundError')L('Error: '+e.message,'fail');});
};
document.getElementById('btn-check').onclick=function(){
 navigator.hid.getDevices().then(function(ds){
  var mb=ds.filter(function(d){return d.vendorId===0x0D28;});
  if(mb.length){device=mb[0];document.getElementById('s1').innerHTML='<span class="done">'+device.productName+' (silent)</span>';L('Silent: '+device.productName,'done');update();}
  else L('No paired','info');
 });
};

fetch(API+'/api/catalog').then(function(r){return r.json();}).then(function(progs){
 var mb=progs.filter(function(p){return p.format==='.hex';});
 var h='';mb.forEach(function(p){h+='<span class="prog" data-id="'+p.id+'">'+p.name+'</span> ';});
 document.getElementById('catalog').innerHTML=h;
 document.querySelectorAll('.prog').forEach(function(el){el.onclick=function(){
  document.querySelectorAll('.prog').forEach(function(e){e.classList.remove('sel');});
  el.classList.add('sel');
  var id=el.dataset.id,nm=el.textContent;
  L('Fetching: '+nm+'...','info');
  fetch(API+'/api/catalog/'+encodeURIComponent(id)).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.blob();}).then(function(blob){
   hexBlob=blob;progName=nm;
   document.getElementById('s2').innerHTML='<span class="done">'+nm+' ('+Math.round(blob.size/1024)+'KB)</span>';
   L('Loaded: '+nm+' — '+Math.round(blob.size/1024)+'KB','done');
   blob.text().then(function(t){hexBytes=hexToBinary(t);if(hexBytes)L('Parsed: '+Math.round(hexBytes.length/1024)+'KB','info');});
   update();
  }).catch(function(e){L('Fetch: '+e.message,'fail');});
 };});
 L('Catalog: '+mb.length+' programs','info');
}).catch(function(e){L('Catalog: '+e.message,'fail');});

function update(){document.getElementById('btn-go').disabled=!(device&&hexBytes);}

// CMSIS-DAP over HID protocol
// HID report: [reportId(1 byte)] + [CMSIS-DAP command]
// Input reports come as events, we need to match request/response

document.getElementById('btn-go').onclick=function(){
 var btn=document.getElementById('btn-go'),d=device,bin=hexBytes;
 btn.disabled=true;btn.textContent='Flashing...';
 document.getElementById('s3').innerHTML='<span class="info">Running...</span>';
 function add(s,l){L((s==='done'?'OK':s==='failed'?'FAIL':'--')+' '+l,s==='done'?'done':s==='failed'?'fail':'info');}
 add('info','WebHID flash: '+progName);

 var pendingQueue=[];
 // Listen for input reports
 function onReport(e){
  var data=new Uint8Array(e.data.buffer);
  if(pendingQueue.length>0){
   var cb=pendingQueue.shift();
   cb(data);
  }
 }
 d.addEventListener('inputreport', onReport);

 function sendCmd(cmdByte, cmdData){
  return new Promise(function(ok,fail){
   // Build HID output report: 64 bytes payload (no report ID prefix)
   var report=new Uint8Array(64);
   report[0]=cmdByte;
   if(cmdData){
    var arr=new Uint8Array(cmdData.buffer||cmdData);
    for(var i=0;i<Math.min(arr.length,63);i++)report[i+1]=arr[i];
   }
   pendingQueue.push(ok);
   tw(d.sendReport(0, report), 5000, 'sendReport').catch(function(e){
    // Remove our callback if sendReport failed
    var idx=pendingQueue.indexOf(ok);
    if(idx>=0)pendingQueue.splice(idx,1);
    fail(e);
   });
  });
 }

 // Open device
 d.open().then(function(){
  add('done','HID device opened');

  // Step 1: DAP_INFO (cmd 0x00, info=0xF0 = capabilities)
  L('Sending DAP_INFO (0x00)...','info');
  return sendCmd(0x00, new Uint8Array([0xF0]));
 }).then(function(resp){
  L('DAP_INFO response: '+Array.from(resp).map(function(x){return x.toString(16);}).join(' '),'info');
  if(resp[0]===0x00 && resp[1]>0){
   add('done','CMSIS-DAP DAP_INFO works over HID!');
  }else{
   add('done','DAP_INFO returned — CMSIS-DAP alive');
  }

  // Step 2: Vendor OPEN (0x8A)
  L('Sending vendor OPEN (0x8A)...','info');
  return sendCmd(0x8A, new Uint32Array([0]));
 }).then(function(resp){
  if(resp[1]!==0){
   add('failed','OPEN rejected (status='+resp[1]+')');
   throw new Error('OPEN rejected');
  }
  add('done','MSD OPEN accepted');

  // Step 3: Write pages (0x8C)
  var ps=62,off=0,total=bin.length;
  function next(){
   if(off>=total)return Promise.resolve();
   var end=Math.min(total,off+ps);
   var page=bin.slice(off,end);
   var data=new Uint8Array(page.length+1);
   data.set([page.length]);data.set(page,1);off=end;
   if(off%(ps*32)<ps||off>=total)L('  Page '+Math.round(off/1024)+'/'+Math.round(total/1024)+'KB','info');
   return sendCmd(0x8C,data).then(next);
  }
  return next().then(function(){
   add('done','All pages written');

   // Step 4: CLOSE (0x8B)
   return sendCmd(0x8B);
  }).then(function(resp){
   if(resp[1]!==0)throw new Error('CLOSE rejected');
   add('done','MSD CLOSE accepted');

   // Step 5: RESET (0x89)
   return sendCmd(0x89);
  });
 }).then(function(){
  add('done','FLASH COMPLETE via WebHID!');
  document.getElementById('s3').innerHTML='<span class="done">FLASHED!</span>';
  btn.textContent='Done';
 }).catch(function(e){
  add('failed',e.message||e);
  document.getElementById('s3').innerHTML='<span class="fail">'+(e.message||'Failed')+'</span>';
  btn.textContent='Retry';btn.disabled=false;
 }).finally(function(){
  try{d.removeEventListener('inputreport',onReport);}catch(_){}
  try{d.close();}catch(_){}
 });
};
})();
</script>
</body></html>
